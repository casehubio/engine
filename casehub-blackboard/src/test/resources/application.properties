%test.quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway was moved to casehub-persistence-hibernate. Engine tests now use Hibernate create
# strategy and RAM Quartz — apply the same here to avoid needing Flyway or Quartz DDL.
%test.quarkus.hibernate-orm.schema-management.strategy=create
%test.quarkus.quartz.store-type=ram

quarkus.arc.selected-alternatives=io.casehub.blackboard.strategy.PlanningStrategyLoopControl
