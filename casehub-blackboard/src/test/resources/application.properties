# Blackboard tests use in-memory persistence — no Docker, no PostgreSQL required.

# Quartz: use in-memory store (no database connection needed)
quarkus.quartz.store-type=ram

# Force Quarkus to scan casehub-persistence-memory jar for CDI beans (no Jandex index in that jar)
quarkus.index-dependency.persistence-memory.group-id=io.casehub
quarkus.index-dependency.persistence-memory.artifact-id=casehub-persistence-memory

# Activate in-memory repository implementations and the blackboard LoopControl alternative
quarkus.arc.selected-alternatives=io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,io.casehub.persistence.memory.InMemoryCaseInstanceRepository,io.casehub.persistence.memory.InMemoryEventLogRepository,io.casehub.blackboard.control.PlanningStrategyLoopControl
