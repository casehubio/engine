# H2 in-memory datasource — quarkus-test-h2 configures the JDBC URL automatically
quarkus.datasource.db-kind=h2
quarkus.hibernate-orm.database.generation=none

# Flyway: run quarkus-ledger migrations (V1000+) then our V2000
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.ledger.enabled=true
quarkus.ledger.hash-chain.enabled=true
quarkus.ledger.decision-context.enabled=false
quarkus.ledger.attestations.enabled=false
quarkus.ledger.trust-score.enabled=false
quarkus.ledger.identity.tokenisation.enabled=false
