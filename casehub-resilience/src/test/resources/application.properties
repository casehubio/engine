# Index engine and api modules so Quarkus discovers their CDI beans
quarkus.index-dependency.engine.group-id=io.casehub
quarkus.index-dependency.engine.artifact-id=engine
quarkus.index-dependency.api.group-id=io.casehub
quarkus.index-dependency.api.artifact-id=api

# Activate in-memory persistence plus the PoisonPill guard for integration tests.
quarkus.arc.selected-alternatives=\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.resilience.poison.PoisonPillWorkerExecutionGuard

# Lower threshold for faster integration tests (default is 5)
casehub.resilience.poison-pill.threshold=3

# Short budget so CaseTimeoutEnforcerIntegrationTest faults quickly.
# Existing integration tests complete in well under 1s so they are unaffected.
casehub.resilience.timeout.max-duration=PT1S

# quarkus-ledger JPA entities land on the classpath via engine -> quarkus-ledger.
# Provide H2 so Hibernate can start; resilience tests use in-memory repos.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:resiliencetestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.flyway.migrate-at-start=false
