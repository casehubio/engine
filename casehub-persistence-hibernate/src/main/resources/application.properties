# Flyway manages schema from V1__schema.sql — single file, no incremental migrations
quarkus.flyway.migrate-at-start=true

# Hibernate validates schema against Flyway-managed DDL
quarkus.hibernate-orm.schema-management.strategy=validate

# Production datasource — both reactive (Hibernate Reactive) and JDBC (Flyway + Quartz)
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casehub}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casehub}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
