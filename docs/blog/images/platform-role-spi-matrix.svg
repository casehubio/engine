<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #2d3436; }
    .sublabel { font-size: 9.5px; fill: #636e72; }
    .header-text { font-size: 11px; font-weight: 600; fill: #636e72; letter-spacing: 0.5px; }
    .connector { stroke-width: 1.5; fill: none; }
  </style>

  <!-- Column headers -->
  <text x="80" y="28" class="header-text" text-anchor="middle">PLATFORMROLE</text>
  <text x="240" y="28" class="header-text" text-anchor="middle">MARKER</text>
  <text x="450" y="28" class="header-text" text-anchor="middle">ENGINE SPI</text>
  <text x="700" y="28" class="header-text" text-anchor="middle">CONSUMER</text>

  <line x1="20" y1="40" x2="820" y2="40" stroke="#dfe6e9" stroke-width="1"/>

  <!-- ===== SUPERVISOR row ===== -->
  <rect x="20" y="55" width="120" height="50" rx="6" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.5"/>
  <text x="80" y="76" class="title" text-anchor="middle">SUPERVISOR</text>
  <text x="80" y="92" class="sublabel" text-anchor="middle">INITIATOR</text>

  <rect x="170" y="55" width="140" height="50" rx="4" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="240" y="76" class="label" text-anchor="middle">SupervisorGate</text>
  <text x="240" y="92" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="55" width="220" height="50" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="450" y="72" class="label" text-anchor="middle">OversightGateService</text>
  <text x="450" y="88" class="sublabel" text-anchor="middle">ActionRiskClassifier</text>

  <rect x="590" y="55" width="220" height="50" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="700" y="72" class="sublabel" text-anchor="middle">ConductorInboxManager</text>
  <text x="700" y="88" class="sublabel" text-anchor="middle">CallbackActionRiskClassifier</text>

  <line x1="140" y1="80" x2="170" y2="80" class="connector" stroke="#fdcb6e"/>
  <line x1="310" y1="80" x2="340" y2="80" class="connector" stroke="#66bb6a"/>
  <line x1="560" y1="80" x2="590" y2="80" class="connector" stroke="#bdbdbd"/>

  <!-- ===== COORDINATOR row ===== -->
  <rect x="20" y="125" width="120" height="50" rx="6" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
  <text x="80" y="146" class="title" text-anchor="middle">COORDINATOR</text>
  <text x="80" y="162" class="sublabel" text-anchor="middle">INITIATOR</text>

  <rect x="170" y="125" width="140" height="50" rx="4" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1"/>
  <text x="240" y="146" class="label" text-anchor="middle">Coordinator</text>
  <text x="240" y="162" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="125" width="220" height="50" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="450" y="146" class="label" text-anchor="middle">CoordinationDriver</text>
  <text x="450" y="162" class="sublabel" text-anchor="middle">delegate · aggregate · allocate</text>

  <rect x="590" y="125" width="220" height="50" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="700" y="146" class="sublabel" text-anchor="middle">OrchestratedDriver</text>
  <text x="700" y="162" class="sublabel" text-anchor="middle">ChoreographedDriver</text>

  <line x1="140" y1="150" x2="170" y2="150" class="connector" stroke="#0984e3"/>
  <line x1="310" y1="150" x2="340" y2="150" class="connector" stroke="#66bb6a"/>
  <line x1="560" y1="150" x2="590" y2="150" class="connector" stroke="#bdbdbd"/>

  <!-- ===== JUDGE row ===== -->
  <rect x="20" y="195" width="120" height="50" rx="6" fill="#a29bfe" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="80" y="216" class="title" text-anchor="middle">JUDGE</text>
  <text x="80" y="232" class="sublabel" text-anchor="middle">PEER</text>

  <rect x="170" y="195" width="140" height="50" rx="4" fill="#ede7f6" stroke="#7e57c2" stroke-width="1"/>
  <text x="240" y="216" class="label" text-anchor="middle">Judge</text>
  <text x="240" y="232" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="195" width="220" height="50" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="450" y="216" class="label" text-anchor="middle">EvaluationProtocol</text>
  <text x="450" y="232" class="sublabel" text-anchor="middle">evaluate · score · renderDecision</text>

  <rect x="590" y="195" width="220" height="50" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="700" y="216" class="sublabel" text-anchor="middle">JudgmentProtocol</text>
  <text x="700" y="232" class="sublabel" text-anchor="middle">ConsensusAgreement</text>

  <line x1="140" y1="220" x2="170" y2="220" class="connector" stroke="#6c5ce7"/>
  <line x1="310" y1="220" x2="340" y2="220" class="connector" stroke="#66bb6a"/>
  <line x1="560" y1="220" x2="590" y2="220" class="connector" stroke="#bdbdbd"/>

  <!-- ===== MODERATOR row ===== -->
  <rect x="20" y="265" width="120" height="50" rx="6" fill="#fd79a8" stroke="#e84393" stroke-width="1.5"/>
  <text x="80" y="286" class="title" text-anchor="middle">MODERATOR</text>
  <text x="80" y="302" class="sublabel" text-anchor="middle">PEER</text>

  <rect x="170" y="265" width="140" height="50" rx="4" fill="#fce4ec" stroke="#ec407a" stroke-width="1"/>
  <text x="240" y="286" class="label" text-anchor="middle">Moderator</text>
  <text x="240" y="302" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="265" width="220" height="50" rx="4" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="450" y="286" class="label" text-anchor="middle">ProtocolEnforcement</text>
  <text x="450" y="302" class="sublabel" text-anchor="middle">requestTurn · handleViolation</text>

  <rect x="590" y="265" width="220" height="50" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="700" y="286" class="sublabel" text-anchor="middle">AgentType.MODERATOR</text>
  <text x="700" y="302" class="sublabel" text-anchor="middle">(debate protocol)</text>

  <line x1="140" y1="290" x2="170" y2="290" class="connector" stroke="#e84393"/>
  <line x1="310" y1="290" x2="340" y2="290" class="connector" stroke="#66bb6a"/>
  <line x1="560" y1="290" x2="590" y2="290" class="connector" stroke="#bdbdbd"/>

  <!-- ===== Legend ===== -->
  <rect x="20" y="340" width="800" height="60" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="40" y="358" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="64" y="370" class="sublabel">Engine SPI — behavioral contract the platform owns</text>
  <rect x="380" y="358" width="16" height="16" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="404" y="370" class="sublabel">Consumer — intelligence-layer implementation (agency, drafthouse)</text>
  <text x="40" y="390" class="sublabel">INITIATOR roles carry authority. PEER roles participate under an initiator's coordination.</text>
</svg>
