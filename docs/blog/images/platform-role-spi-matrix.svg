<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #2d3436; }
    .sublabel { font-size: 10px; fill: #636e72; }
    .role-box { rx: 6; ry: 6; }
    .marker-box { rx: 4; ry: 4; }
    .spi-box { rx: 4; ry: 4; }
    .consumer-box { rx: 4; ry: 4; stroke-dasharray: 5,3; }
    .header-text { font-size: 11px; font-weight: 600; fill: #636e72; text-transform: uppercase; letter-spacing: 0.5px; }
    .connector { stroke-width: 1.5; fill: none; }
  </style>

  <!-- Column headers -->
  <text x="80" y="30" class="header-text" text-anchor="middle">PlatformRole</text>
  <text x="240" y="30" class="header-text" text-anchor="middle">Marker</text>
  <text x="440" y="30" class="header-text" text-anchor="middle">Engine SPI</text>
  <text x="660" y="30" class="header-text" text-anchor="middle">Consumer</text>

  <!-- Divider line -->
  <line x1="20" y1="40" x2="760" y2="40" stroke="#dfe6e9" stroke-width="1"/>

  <!-- SUPERVISOR row -->
  <rect x="20" y="55" width="120" height="50" class="role-box" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.5"/>
  <text x="80" y="76" class="title" text-anchor="middle">SUPERVISOR</text>
  <text x="80" y="92" class="sublabel" text-anchor="middle">INITIATOR</text>

  <rect x="170" y="55" width="140" height="50" class="marker-box" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="240" y="76" class="label" text-anchor="middle">SupervisorGate</text>
  <text x="240" y="92" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="55" width="200" height="50" class="spi-box" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="440" y="72" class="label" text-anchor="middle">OversightGateService</text>
  <text x="440" y="88" class="sublabel" text-anchor="middle">ActionRiskClassifier</text>

  <rect x="570" y="55" width="180" height="50" class="consumer-box" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="660" y="76" class="sublabel" text-anchor="middle">ConductorInboxManager</text>
  <text x="660" y="92" class="sublabel" text-anchor="middle">CallbackActionRiskClassifier</text>

  <line x1="140" y1="80" x2="170" y2="80" class="connector" stroke="#fdcb6e"/>
  <line x1="310" y1="80" x2="340" y2="80" class="connector" stroke="#66bb6a"/>
  <line x1="540" y1="80" x2="570" y2="80" class="connector" stroke="#bdbdbd"/>

  <!-- COORDINATOR row -->
  <rect x="20" y="125" width="120" height="50" class="role-box" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
  <text x="80" y="146" class="title" text-anchor="middle">COORDINATOR</text>
  <text x="80" y="162" class="sublabel" text-anchor="middle">INITIATOR</text>

  <rect x="170" y="125" width="140" height="50" class="marker-box" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1"/>
  <text x="240" y="146" class="label" text-anchor="middle">Coordinator</text>
  <text x="240" y="162" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="125" width="200" height="50" class="spi-box" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="440" y="146" class="label" text-anchor="middle">CoordinationDriver</text>
  <text x="440" y="162" class="sublabel" text-anchor="middle">delegate · aggregate · allocate</text>

  <rect x="570" y="125" width="180" height="50" class="consumer-box" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="660" y="146" class="sublabel" text-anchor="middle">OrchestratedDriver</text>
  <text x="660" y="162" class="sublabel" text-anchor="middle">ChoreographedDriver</text>

  <line x1="140" y1="150" x2="170" y2="150" class="connector" stroke="#0984e3"/>
  <line x1="310" y1="150" x2="340" y2="150" class="connector" stroke="#66bb6a"/>
  <line x1="540" y1="150" x2="570" y2="150" class="connector" stroke="#bdbdbd"/>

  <!-- JUDGE row -->
  <rect x="20" y="195" width="120" height="50" class="role-box" fill="#a29bfe" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="80" y="216" class="title" text-anchor="middle">JUDGE</text>
  <text x="80" y="232" class="sublabel" text-anchor="middle">PEER</text>

  <rect x="170" y="195" width="140" height="50" class="marker-box" fill="#ede7f6" stroke="#7e57c2" stroke-width="1"/>
  <text x="240" y="216" class="label" text-anchor="middle">Judge</text>
  <text x="240" y="232" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="195" width="200" height="50" class="spi-box" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="440" y="216" class="label" text-anchor="middle">EvaluationProtocol</text>
  <text x="440" y="232" class="sublabel" text-anchor="middle">evaluate · score · renderDecision</text>

  <rect x="570" y="195" width="180" height="50" class="consumer-box" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="660" y="216" class="sublabel" text-anchor="middle">JudgmentProtocol</text>
  <text x="660" y="232" class="sublabel" text-anchor="middle">ConsensusAgreement</text>

  <line x1="140" y1="220" x2="170" y2="220" class="connector" stroke="#6c5ce7"/>
  <line x1="310" y1="220" x2="340" y2="220" class="connector" stroke="#66bb6a"/>
  <line x1="540" y1="220" x2="570" y2="220" class="connector" stroke="#bdbdbd"/>

  <!-- MODERATOR row -->
  <rect x="20" y="265" width="120" height="50" class="role-box" fill="#fd79a8" stroke="#e84393" stroke-width="1.5"/>
  <text x="80" y="286" class="title" text-anchor="middle">MODERATOR</text>
  <text x="80" y="302" class="sublabel" text-anchor="middle">PEER</text>

  <rect x="170" y="265" width="140" height="50" class="marker-box" fill="#fce4ec" stroke="#ec407a" stroke-width="1"/>
  <text x="240" y="286" class="label" text-anchor="middle">Moderator</text>
  <text x="240" y="302" class="sublabel" text-anchor="middle">Behavior</text>

  <rect x="340" y="265" width="200" height="50" class="spi-box" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="440" y="286" class="label" text-anchor="middle">ProtocolEnforcement</text>
  <text x="440" y="302" class="sublabel" text-anchor="middle">requestTurn · handleViolation</text>

  <rect x="570" y="265" width="180" height="50" class="consumer-box" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="660" y="286" class="sublabel" text-anchor="middle">AgentType.MODERATOR</text>
  <text x="660" y="302" class="sublabel" text-anchor="middle">(debate protocol)</text>

  <line x1="140" y1="290" x2="170" y2="290" class="connector" stroke="#e84393"/>
  <line x1="310" y1="290" x2="340" y2="290" class="connector" stroke="#66bb6a"/>
  <line x1="540" y1="290" x2="570" y2="290" class="connector" stroke="#bdbdbd"/>

  <!-- Legend -->
  <rect x="20" y="340" width="740" height="60" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="40" y="355" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="62" y="367" class="sublabel">Engine SPI — behavioral contract the platform owns</text>
  <rect x="340" y="355" width="16" height="16" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="362" y="367" class="sublabel">Consumer — intelligence-layer implementation (agency, drafthouse)</text>
  <text x="40" y="388" class="sublabel">INITIATOR roles carry authority. PEER roles participate under an initiator's coordination.</text>
</svg>
