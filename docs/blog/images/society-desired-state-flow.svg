<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Column 1: Declaration -->
  <rect x="20" y="20" width="150" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="42" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">Org Diagram</text>
  <text x="95" y="56" text-anchor="middle" fill="#64748b" font-size="10">(YAML seed)</text>

  <rect x="20" y="90" width="150" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="95" y="112" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Emergence</text>
  <text x="95" y="126" text-anchor="middle" fill="#64748b" font-size="10">(DetectedTeam promotion)</text>

  <rect x="20" y="160" width="150" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="95" y="182" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Coalition Proposal</text>
  <text x="95" y="196" text-anchor="middle" fill="#64748b" font-size="10">(agent-initiated)</text>

  <!-- Arrow to centre -->
  <line x1="170" y1="45" x2="220" y2="115" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="170" y1="115" x2="220" y2="115" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="170" y1="185" x2="220" y2="115" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>

  <!-- Column 2: Desired State Graph -->
  <rect x="220" y="85" width="160" height="60" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Desired State</text>
  <text x="300" y="126" text-anchor="middle" fill="#7c3aed" font-size="11">Graph</text>

  <!-- Arrow down to diff -->
  <line x1="300" y1="145" x2="300" y2="180" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>

  <!-- Diff -->
  <rect x="240" y="180" width="120" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="300" y="204" text-anchor="middle" fill="#e2e8f0" font-size="12">diff (Δ)</text>

  <!-- Actual State -->
  <rect x="220" y="250" width="160" height="60" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="275" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Actual State</text>
  <text x="300" y="291" text-anchor="middle" fill="#475569" font-size="11">(GroupInstance)</text>

  <line x1="300" y1="250" x2="300" y2="220" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>

  <!-- Arrow to transition plan -->
  <line x1="360" y1="200" x2="420" y2="200" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>

  <!-- Column 3: Execution -->
  <rect x="420" y="30" width="140" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="490" y="54" text-anchor="middle" fill="#fcd34d" font-size="12">Approval Gate</text>
  <text x="490" y="18" text-anchor="middle" fill="#64748b" font-size="10">selfDetermination</text>

  <rect x="420" y="90" width="140" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="490" y="114" text-anchor="middle" fill="#e2e8f0" font-size="12">Transition Plan</text>

  <rect x="420" y="160" width="140" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="490" y="184" text-anchor="middle" fill="#6ee7b7" font-size="12">Execute Phases</text>

  <rect x="420" y="230" width="140" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="490" y="254" text-anchor="middle" fill="#93c5fd" font-size="12">Reconcile</text>

  <line x1="490" y1="70" x2="490" y2="90" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="490" y1="130" x2="490" y2="160" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="490" y1="200" x2="490" y2="230" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>

  <!-- Reconcile loops back -->
  <path d="M 560 250 Q 620 250 620 165 Q 620 85 540 85" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="640" y="170" text-anchor="start" fill="#475569" font-size="9" transform="rotate(90, 640, 170)">drift → retry</text>

  <!-- Column 4: Result -->
  <rect x="580" y="290" width="100" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="630" y="314" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Converged</text>

  <line x1="490" y1="270" x2="580" y2="300" stroke="#64748b" stroke-width="1" marker-end="url(#arw)"/>
</svg>
