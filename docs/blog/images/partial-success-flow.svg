<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Mixed Step Results — Before and After</text>

  <!-- BEFORE section -->
  <text x="20" y="60" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">BEFORE</text>
  <rect x="20" y="70" width="680" height="100" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>

  <!-- Workflow box -->
  <rect x="40" y="85" width="120" height="50" rx="6" fill="white" stroke="#94a3b8"/>
  <text x="100" y="114" text-anchor="middle" fill="#334155">Workflow</text>

  <!-- Steps -->
  <rect x="200" y="85" width="80" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="240" y="100" text-anchor="middle" fill="#166534" font-size="11">Step 1 ✓</text>
  <rect x="200" y="113" width="80" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="240" y="128" text-anchor="middle" fill="#991b1b" font-size="11">Step 2 ✗</text>

  <line x1="160" y1="110" x2="192" y2="100" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="160" y1="110" x2="192" y2="124" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Success result (wrong) -->
  <rect x="340" y="88" width="100" height="44" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="390" y="108" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">Success</text>
  <text x="390" y="124" text-anchor="middle" fill="#166534" font-size="10">← silent lie</text>

  <line x1="288" y1="110" x2="332" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Normal return -->
  <rect x="500" y="88" width="110" height="44" rx="6" fill="white" stroke="#94a3b8"/>
  <text x="555" y="108" text-anchor="middle" fill="#334155" font-size="11">Normal return</text>
  <text x="555" y="124" text-anchor="middle" fill="#94a3b8" font-size="10">no recovery</text>

  <line x1="448" y1="110" x2="492" y2="110" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- AFTER section -->
  <text x="20" y="200" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">AFTER</text>
  <rect x="20" y="210" width="680" height="110" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>

  <!-- Workflow box -->
  <rect x="40" y="230" width="120" height="50" rx="6" fill="white" stroke="#94a3b8"/>
  <text x="100" y="259" text-anchor="middle" fill="#334155">Workflow</text>

  <!-- Steps -->
  <rect x="200" y="230" width="80" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="240" y="245" text-anchor="middle" fill="#166534" font-size="11">Step 1 ✓</text>
  <rect x="200" y="258" width="80" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="240" y="273" text-anchor="middle" fill="#991b1b" font-size="11">Step 2 ✗</text>

  <line x1="160" y1="255" x2="192" y2="245" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="160" y1="255" x2="192" y2="269" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- PartialSuccess -->
  <rect x="330" y="233" width="120" height="44" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="2"/>
  <text x="390" y="252" text-anchor="middle" font-weight="600" fill="#854d0e" font-size="12">PartialSuccess</text>
  <text x="390" y="268" text-anchor="middle" fill="#854d0e" font-size="10">mixed results</text>

  <line x1="288" y1="255" x2="322" y2="255" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Recovery path -->
  <rect x="510" y="225" width="110" height="56" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="565" y="248" text-anchor="middle" fill="#5b21b6" font-size="11">Recovery</text>
  <text x="565" y="264" text-anchor="middle" fill="#5b21b6" font-size="11">Coordinator</text>
  <text x="565" y="278" text-anchor="middle" fill="#7c3aed" font-size="9">retry / compensate</text>

  <line x1="458" y1="255" x2="502" y2="255" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
