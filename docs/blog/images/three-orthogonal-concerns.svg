<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#fafafa" rx="8"/>

  <!-- BEFORE: tangled -->
  <text x="170" y="32" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Before: tangled in one enum</text>

  <!-- TopologyType box with GRADUATED highlighted -->
  <rect x="40" y="50" width="260" height="180" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="74" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">TopologyType</text>
  <line x1="60" y1="84" x2="280" y2="84" stroke="#e2e8f0" stroke-width="1"/>

  <text x="80" y="108" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">CENTRALISED</text>
  <text x="230" y="108" font-size="10" fill="#94a3b8">← structure</text>
  <text x="80" y="130" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">DISTRIBUTED</text>
  <text x="230" y="130" font-size="10" fill="#94a3b8">← structure</text>
  <text x="80" y="152" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">HYBRID</text>
  <text x="230" y="152" font-size="10" fill="#94a3b8">← structure</text>
  <text x="80" y="174" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">HIERARCHICAL</text>
  <text x="230" y="174" font-size="10" fill="#94a3b8">← structure</text>

  <!-- GRADUATED highlighted as wrong -->
  <rect x="68" y="186" width="220" height="22" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="80" y="202" font-size="11" fill="#dc2626" font-weight="600" font-family="JetBrains Mono, monospace">GRADUATED</text>
  <text x="230" y="202" font-size="10" fill="#dc2626">← transition?</text>

  <!-- Arrow -->
  <line x1="330" y1="140" x2="390" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AFTER: separated -->
  <text x="540" y="32" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">After: three orthogonal concerns</text>

  <!-- TopologyType (structure) -->
  <rect x="410" y="50" width="270" height="68" rx="6" fill="white" stroke="#86efac" stroke-width="1.5"/>
  <text x="545" y="72" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">TopologyType — what it IS</text>
  <text x="545" y="92" font-size="10" fill="#64748b" text-anchor="middle" font-family="JetBrains Mono, monospace">CENTRALISED | DISTRIBUTED | HYBRID | ...</text>

  <!-- TransitionPolicy (transition) -->
  <rect x="410" y="130" width="270" height="68" rx="6" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="545" y="152" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">TransitionPolicy — when it CHANGES</text>
  <text x="545" y="172" font-size="10" fill="#64748b" text-anchor="middle" font-family="JetBrains Mono, monospace">from | to | trigger | strategy</text>

  <!-- CoordinationDriver (behavior) -->
  <rect x="410" y="210" width="270" height="68" rx="6" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="545" y="232" font-size="11" font-weight="600" fill="#5b21b6" text-anchor="middle">CoordinationDriver — what it DOES</text>
  <text x="545" y="252" font-size="10" fill="#64748b" text-anchor="middle" font-family="JetBrains Mono, monospace">delegate | aggregate | allocate</text>

  <!-- Caption -->
  <text x="360" y="320" font-size="11" fill="#94a3b8" text-anchor="middle">GRADUATED tried to encode transition behavior as a topology value — the fix separates the concerns</text>
</svg>
