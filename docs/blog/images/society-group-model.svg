<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Society root -->
  <rect x="260" y="20" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">Society: ClaimsOps</text>

  <!-- Group: AutoClaims -->
  <rect x="40" y="130" width="200" height="140" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="155" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">AutoClaims</text>
  <text x="140" y="175" text-anchor="middle" fill="#64748b" font-size="11">topology: hive</text>
  <rect x="60" y="190" width="70" height="24" rx="4" fill="#1e3a5f"/>
  <text x="95" y="206" text-anchor="middle" fill="#93c5fd" font-size="10">Triage</text>
  <rect x="140" y="190" width="80" height="24" rx="4" fill="#1e3a5f"/>
  <text x="180" y="206" text-anchor="middle" fill="#93c5fd" font-size="10">Assessor</text>
  <rect x="80" y="224" width="100" height="24" rx="4" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="130" y="240" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">Coordinator</text>

  <!-- Group: FraudWatch -->
  <rect x="260" y="130" width="200" height="140" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">FraudWatch</text>
  <text x="360" y="175" text-anchor="middle" fill="#64748b" font-size="11">topology: swarm</text>
  <rect x="280" y="190" width="70" height="24" rx="4" fill="#3b2a0a"/>
  <text x="315" y="206" text-anchor="middle" fill="#fcd34d" font-size="10">Analyst</text>
  <rect x="360" y="190" width="80" height="24" rx="4" fill="#3b2a0a"/>
  <text x="400" y="206" text-anchor="middle" fill="#fcd34d" font-size="10">Investigator</text>
  <text x="360" y="250" text-anchor="middle" fill="#92400e" font-size="10">selfDetermination: 0.7</text>

  <!-- Group: CyberClaims (new, dashed) -->
  <rect x="480" y="130" width="200" height="140" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="580" y="155" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">CyberClaims</text>
  <text x="580" y="175" text-anchor="middle" fill="#64748b" font-size="11">topology: swarm → hive</text>
  <rect x="500" y="190" width="70" height="24" rx="4" fill="#052e16"/>
  <text x="535" y="206" text-anchor="middle" fill="#6ee7b7" font-size="10">Specialist</text>
  <rect x="580" y="190" width="80" height="24" rx="4" fill="#052e16"/>
  <text x="620" y="206" text-anchor="middle" fill="#6ee7b7" font-size="10">Assessor</text>
  <text x="580" y="250" text-anchor="middle" fill="#065f46" font-size="10">emergent formation</text>

  <!-- Sub-group: CyberFraudCell -->
  <rect x="340" y="320" width="180" height="70" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="430" y="345" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">CyberFraudCell</text>
  <text x="430" y="365" text-anchor="middle" fill="#64748b" font-size="10">topology: hive | selfDet: 0.8</text>
  <text x="430" y="380" text-anchor="middle" fill="#92400e" font-size="9">spawned by SituationRecompiler</text>

  <!-- Connecting lines -->
  <line x1="360" y1="70" x2="140" y2="130" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="360" y2="130" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="70" x2="580" y2="130" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="270" x2="430" y2="320" stroke="#64748b" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
</svg>
