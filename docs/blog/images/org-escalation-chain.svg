<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-esc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Org-Aware Escalation</text>

  <!-- Primary selection fails -->
  <rect x="30" y="50" width="160" height="50" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="110" y="72" text-anchor="middle" fill="#991b1b" font-size="12">Primary Selection</text>
  <text x="110" y="88" text-anchor="middle" fill="#dc2626" font-size="11">→ Unresolvable</text>

  <!-- Escalation trigger -->
  <line x1="198" y1="75" x2="250" y2="75" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-esc)"/>
  <text x="224" y="65" text-anchor="middle" fill="#7c3aed" font-size="10">escalate()</text>

  <!-- Org tree -->
  <rect x="260" y="40" width="310" height="240" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="415" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Org Supervision Tree</text>

  <!-- Agent A (failed) -->
  <rect x="340" y="200" width="100" height="38" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="390" y="216" text-anchor="middle" fill="#991b1b" font-size="11">Agent A</text>
  <text x="390" y="230" text-anchor="middle" fill="#dc2626" font-size="9">exhausted</text>

  <!-- Supervisor B (overloaded) -->
  <rect x="280" y="135" width="100" height="38" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="330" y="151" text-anchor="middle" fill="#92400e" font-size="11">Supervisor B</text>
  <text x="330" y="165" text-anchor="middle" fill="#b45309" font-size="9">overloaded</text>

  <!-- Supervisor C (ready) -->
  <rect x="430" y="135" width="110" height="38" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="485" y="151" text-anchor="middle" font-weight="600" fill="#166534" font-size="11">Supervisor C</text>
  <text x="485" y="165" text-anchor="middle" fill="#16a34a" font-size="9">Ready ✓</text>

  <!-- Director D -->
  <rect x="360" y="78" width="100" height="38" rx="6" fill="white" stroke="#d1d5db"/>
  <text x="410" y="94" text-anchor="middle" fill="#6b7280" font-size="11">Director D</text>
  <text x="410" y="108" text-anchor="middle" fill="#9ca3af" font-size="9">not reached</text>

  <!-- Tree lines -->
  <line x1="390" y1="200" x2="330" y2="173" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="390" y1="200" x2="485" y2="173" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="330" y1="135" x2="410" y2="116" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="485" y1="135" x2="410" y2="116" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Escalation walk arrows -->
  <path d="M380,200 C360,185 340,180 340,173" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-esc)"/>
  <path d="M370,155 C400,145 440,145 460,155" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-esc)"/>

  <!-- Walk labels -->
  <text x="345" y="192" fill="#7c3aed" font-size="9">1. walk up</text>
  <text x="402" y="142" fill="#7c3aed" font-size="9">2. try sibling</text>

  <!-- Result -->
  <rect x="30" y="240" width="200" height="50" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="130" y="262" text-anchor="middle" fill="#166534" font-size="12">Selected: Supervisor C</text>
  <text x="130" y="278" text-anchor="middle" fill="#16a34a" font-size="10">via org escalation</text>

  <path d="M485,173 C500,220 350,250 238,265" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
</svg>
