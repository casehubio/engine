<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', sans-serif; }
    .title { font-size: 13px; font-weight: 600; }
    .label { font-size: 11px; fill: #2d3436; }
    .sublabel { font-size: 10px; fill: #636e72; }
    .accent { font-size: 10px; fill: #e17055; font-weight: 600; }
    .good { font-size: 10px; fill: #00b894; font-weight: 600; }
  </style>

  <!-- BEFORE -->
  <text x="170" y="24" class="title" text-anchor="middle" fill="#636e72">BEFORE</text>

  <rect x="30" y="40" width="280" height="110" rx="8" fill="#fff5f5" stroke="#fab1a0" stroke-width="1.5"/>

  <rect x="50" y="58" width="100" height="30" rx="4" fill="#ffeaa7" stroke="#fdcb6e"/>
  <text x="100" y="78" class="label" text-anchor="middle">SUPERVISOR</text>
  <text x="175" y="78" class="good">has SPI</text>

  <rect x="50" y="98" width="100" height="30" rx="4" fill="#74b9ff" stroke="#0984e3"/>
  <text x="100" y="118" class="label" text-anchor="middle">COORDINATOR</text>
  <text x="175" y="118" class="accent">no contract</text>

  <rect x="195" y="58" width="100" height="30" rx="4" fill="#a29bfe" stroke="#6c5ce7"/>
  <text x="245" y="78" class="label" text-anchor="middle">JUDGE</text>
  <text x="175" y="158" class="accent">no contract</text>

  <rect x="195" y="98" width="100" height="30" rx="4" fill="#fd79a8" stroke="#e84393"/>
  <text x="245" y="118" class="label" text-anchor="middle">MODERATOR</text>

  <!-- Arrow pointing to "behavior locked in consumer" -->
  <path d="M 170 140 L 170 160" stroke="#e17055" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <rect x="60" y="165" width="220" height="35" rx="4" fill="#ffebed" stroke="#fab1a0" stroke-dasharray="4,3"/>
  <text x="170" y="185" class="sublabel" text-anchor="middle">behavior locked in agency / drafthouse</text>
  <text x="170" y="198" class="sublabel" text-anchor="middle">no engine-level testable contract</text>

  <!-- AFTER -->
  <text x="525" y="24" class="title" text-anchor="middle" fill="#636e72">AFTER</text>

  <rect x="385" y="40" width="280" height="110" rx="8" fill="#f0fff4" stroke="#81ecec" stroke-width="1.5"/>

  <rect x="405" y="58" width="100" height="30" rx="4" fill="#ffeaa7" stroke="#fdcb6e"/>
  <text x="455" y="78" class="label" text-anchor="middle">SUPERVISOR</text>
  <text x="530" y="78" class="good">OversightGate</text>

  <rect x="405" y="98" width="100" height="30" rx="4" fill="#74b9ff" stroke="#0984e3"/>
  <text x="455" y="118" class="label" text-anchor="middle">COORDINATOR</text>
  <text x="540" y="118" class="good">CoordinationDriver</text>

  <rect x="550" y="58" width="100" height="30" rx="4" fill="#a29bfe" stroke="#6c5ce7"/>
  <text x="600" y="78" class="label" text-anchor="middle">JUDGE</text>

  <rect x="550" y="98" width="100" height="30" rx="4" fill="#fd79a8" stroke="#e84393"/>
  <text x="600" y="118" class="label" text-anchor="middle">MODERATOR</text>

  <!-- Arrow pointing to "every role has a contract" -->
  <path d="M 525 140 L 525 160" stroke="#00b894" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

  <rect x="405" y="165" width="250" height="35" rx="4" fill="#e6fff5" stroke="#81ecec" stroke-dasharray="4,3"/>
  <text x="530" y="185" class="sublabel" text-anchor="middle">every role: marker → SPI → NoOp default</text>
  <text x="530" y="198" class="sublabel" text-anchor="middle">testable, swappable, engine-owned</text>

  <text x="530" y="78" class="good" text-anchor="start">OversightGate</text>
  <text x="413" y="158" class="good">EvaluationProtocol</text>
  <text x="555" y="158" class="good">ProtocolEnforcement</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e17055" stroke-width="1"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#00b894" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Connecting arrow between the two panels -->
  <path d="M 330 120 L 370 120" stroke="#636e72" stroke-width="2" fill="none" marker-end="url(#arr-main)"/>
  <defs>
    <marker id="arr-main" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#636e72" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Bottom annotation -->
  <text x="350" y="260" class="sublabel" text-anchor="middle">The engine defines what each role mechanically means.</text>
  <text x="350" y="276" class="sublabel" text-anchor="middle">Intelligence-layer repos provide the implementations.</text>
</svg>
