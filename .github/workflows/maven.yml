name: Java CI with Maven

on:
  pull_request:

permissions:
  contents: read

jobs:
  os-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B package --file pom.xml

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 5

  maven-version-test:
    name: Maven compatibility (Maven ${{ matrix.mvn }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mvn: ['3.9.14']
        java: ['17']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven Wrapper for specified version
        run: mvn -N wrapper:wrapper -Dmaven=${{ matrix.mvn }}

      - name: Build and test
        run: ./mvnw -B package --file pom.xml
        shell: bash

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-mvn-${{ matrix.mvn }}-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 5