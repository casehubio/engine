name: Generate API Docs
on:
  push:
    branches: [main]
    paths:
      - 'api/src/main/java/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.repository_owner == 'casehubio'
    uses: casehubio/parent/.github/workflows/generate-api-docs.yml@main
    secrets: inherit

