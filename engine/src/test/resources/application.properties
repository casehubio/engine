quarkus.hibernate-orm.mapping.format.global=ignore

# Test profile - use Dev Services (automatic PostgreSQL in Docker)
%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.format-sql=true
%test.quarkus.hibernate-orm.log.bind-parameters=true

# Enable Dev Services for tests - Quarkus will automatically start PostgreSQL in Docker
%test.quarkus.devservices.enabled=true
