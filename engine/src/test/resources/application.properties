# Disable Ollama Dev Services — model preloading is not needed for tests
quarkus.langchain4j.ollama.devservices.enabled=false

# Quartz: use in-memory store (no database connection needed)
quarkus.quartz.store-type=ram
quarkus.quartz.clustered=false

# Dev Services: do not keep Testcontainers databases alive after Maven test runs.
quarkus.datasource.devservices.reuse=false
# Worker execution: short timeout for faster tests
casehub.engine.worker.default-timeout-ms=2000

# Hibernate ORM: use dedicated JSON mapper, not the REST ObjectMapper customizer.
# Only applies in default test profile (hibernate). Ignored in memory profile.
quarkus.hibernate-orm.mapping.format.global=ignore

# Schema management: drop-and-create so entity changes are always reflected without
# requiring Flyway migrations in engine tests. Flyway migrations are managed by the
# casehub-persistence-hibernate module for production; engine tests use entity-driven schema.
quarkus.flyway.out-of-order=true
quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# quarkus-ledger is on the engine classpath (via LedgerTraceIdProvider) but its JPA-backed
# beans require a LedgerEntryRepository. NoOpLedgerEntryRepository (@Alternative @Priority(1))
# satisfies that dependency so the in-memory test profile starts cleanly.
