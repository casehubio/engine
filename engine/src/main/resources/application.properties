# PostgreSQL datasource configuration (common)
quarkus.datasource.db-kind=postgresql

# Development mode settings - explicit database connection
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/casehub
%dev.quarkus.datasource.username=casehub
%dev.quarkus.datasource.password=casehub
%dev.quarkus.datasource.devservices.reuse=false
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create



%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.log.format-sql=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.log.level=DEBUG


# Production mode settings - use environment variables or external config
%prod.quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/casehub}
%prod.quarkus.datasource.username=${DATABASE_USERNAME:casehub}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:casehub}
