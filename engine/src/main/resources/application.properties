quarkus.datasource.db-kind=postgresql

quarkus.scheduler.start-mode=forced
quarkus.quartz.clustered=false
quarkus.quartz.store-type=jdbc-cmt
quarkus.quartz.table-prefix=QRTZ_
quarkus.quartz.misfire-policy.task-job=ignore-misfire-policy

# Hibernate validates schema — Flyway in casehub-persistence-hibernate manages DDL
quarkus.hibernate-orm.schema-management.strategy=validate

# Production datasource — reactive only; JDBC URL and credentials live in casehub-persistence-hibernate
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casehub}

quarkus.index-dependency.engine.group-id=io.casehub
quarkus.index-dependency.engine.artifact-id=engine
quarkus.index-dependency.api.group-id=io.casehub
quarkus.index-dependency.api.artifact-id=api
