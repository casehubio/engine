# PostgreSQL datasource configuration (common)
quarkus.datasource.db-kind=postgresql


# QUARTZ CONFIGURATION
quarkus.scheduler.start-mode=forced

quarkus.quartz.clustered=false
quarkus.quartz.store-type=jdbc-cmt
quarkus.quartz.table-prefix=QRTZ_
quarkus.quartz.misfire-policy.task-job=ignore-misfire-policy

# Production mode settings - use environment variables or external config
%prod.quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/casehub}
%prod.quarkus.datasource.username=${DATABASE_USERNAME:casehub}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:casehub}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true